services:
  server:
    build: ./server
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./server/config.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      server:
        condition: service_healthy
